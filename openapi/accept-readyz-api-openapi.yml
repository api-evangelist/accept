openapi: 3.1.0
info:
  title: MIDAS Agents Readyz API
  version: 1.1.0-rc.1
  description: 'Authority governance engine for autonomous decisions. Every evaluation produces exactly one outcome and one tamper-evident audit envelope.

    '
servers:
- url: http://localhost:8080
  description: Local development
security:
- BearerAuth: []
tags:
- name: Readyz
paths:
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness check
      description: Returns 200 when the server is ready to serve traffic, including store connectivity.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Not ready — store unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Readyz
components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Static bearer token. Configured via MIDAS_AUTH_TOKENS or midas.yaml auth.tokens. Not required when auth.mode=open (development only).

        '
