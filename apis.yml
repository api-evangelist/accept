aid: accept
name: Accept
description: >-
  Accept Labs is the company behind MIDAS, an open-source authority-governance engine for
  autonomous decisions. MIDAS evaluates every agent or AI-system action against explicit
  authority, operational boundaries, and execution context before the action occurs, then
  produces exactly one outcome (accept, escalate, reject, or request_clarification) and one
  tamper-evident audit envelope. The platform is Apache-2.0 Go software with a runtime
  evaluation API (POST /v1/evaluate), a YAML control-plane for surfaces/profiles/grants, an
  evidence and integrity API, drift detection, an Explorer UI, and OIDC/local IAM. It is
  positioned for enterprise teams governing what automated actors are authorised to decide.
